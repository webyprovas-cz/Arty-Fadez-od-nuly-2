<!DOCTYPE html>
<html lang="cs">
<head>
<script>document.documentElement.classList.add('js');</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rezervace | Arty Fadez</title>
<meta name="description" content="Rezervujte si termín v barbershopu Arty Fadez online — vyberte službu, datum a volný čas.">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230a0a0a'/%3E%3Ctext x='50' y='68' font-family='Georgia, serif' font-weight='700' font-size='52' fill='%23fcbb00' text-anchor='middle'%3EAF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="booking-page">
<a class="skip-link" href="#hlavni-obsah">Přeskočit na obsah</a>

<nav class="site-nav is-scrolled" id="siteNav">
  <div class="container nav-inner">
    <a href="/" class="brand" aria-label="Arty Fadez — úvod">
      <span class="brand-main">Arty <em>Fadez</em></span>
      <span class="brand-sub">Barbershop</span>
    </a>
    <div class="nav-links">
      <a href="/#sluzby">Služby</a>
      <a href="/#tym">Tým</a>
      <a href="/#kontakt">Kontakt</a>
    </div>
    <div class="nav-actions">
      <a class="btn btn-primary btn-sm nav-cta" href="tel:+420721100331">Zavolat</a>
      <button class="burger" id="burgerBtn" aria-label="Otevřít menu" aria-expanded="false" aria-controls="mobileMenu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>

<div class="mobile-menu" id="mobileMenu">
  <nav aria-label="Mobilní navigace">
    <a href="/#sluzby">Služby</a>
    <a href="/#tym">Tým</a>
    <a href="/#kontakt">Kontakt</a>
    <a class="btn btn-primary" href="tel:+420721100331">Zavolat</a>
  </nav>
</div>

<main id="hlavni-obsah">
  <section class="booking-hero">
    <div class="container" style="max-width:900px">
      <a href="/" class="booking-back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        Zpět Domů
      </a>
      <h1 class="section-title" style="text-align:left">Rezervujte si <span class="text-green">Termín</span></h1>

      <div class="steps" id="steps">
        <div class="step" data-step="1">
          <span class="step-circle">1</span>
          <span class="step-label">Služba</span>
        </div>
        <span class="step-line"></span>
        <div class="step" data-step="2">
          <span class="step-circle">2</span>
          <span class="step-label">Datum &amp; Čas</span>
        </div>
        <span class="step-line"></span>
        <div class="step" data-step="3">
          <span class="step-circle">3</span>
          <span class="step-label">Potvrzení</span>
        </div>
      </div>
    </div>
  </section>

  <div class="container booking-wrap" style="max-width:900px">
    <div class="wizard-panel reveal" id="wizardPanel">
      <div class="wizard-head" id="wizardHead"></div>
      <div class="wizard-body" id="wizardBody"></div>
      <div class="wizard-nav" id="wizardNav"></div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="margin-top:0;border-top:none;padding-top:0;justify-content:center;text-align:center">
      <span>Štěpařská, Praha · <a href="tel:+420721100331">+420 721 100 331</a> · &copy; <span id="year"></span> Arty Fadez · <a href="https://www.instagram.com/arty_fadez/" target="_blank" rel="noopener noreferrer">Instagram</a></span>
    </div>
  </div>
</footer>

<script src="script.js"></script>
<script src="booking.js"></script>
</body>
</html>
